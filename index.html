    <link rel="stylesheet" href="../shared/design-tokens.css" />
<link rel="stylesheet" href="../shared/modern-styles.css" />

  <meta property="og:title" content="P15 地理新闻故事地图" />
  <meta property="og:description" content="地理新闻故事地图 — 前端纯静态新闻工具" />

<style media="print">
.gnav,.pedagogy-panel,.explore-section,[class*="dark-toggle"],button[aria-label]{display:none!important}
body{background:#fff!important;color:#000!important;font-size:11pt}
.app,main,.container{box-shadow:none!important;border:none!important;padding:0!important}
a{color:#000!important;text-decoration:underline}
a[href]::after{content:" (" attr(href) ")";font-size:9pt;color:#666}
@page{margin:2cm}
</style>

<body>
  <main aria-label="主内容区域" class="app">
    <header class="hero">
      <h1>地理新闻故事地图</h1>
      <p>输入坐标点 JSON，自动生成新闻路径地图与事件弹窗。</p>
    </header>

    <section class="card"><details class="teach-card" open><summary>🎓 叙事地图与现场报道</summary><p>叙事地图（Story Map）是将新闻事件的地理位置与叙事结合的可视化方式。记者可以标注采访现场、事件发生地、数据采集点，帮助读者理解事件的空间分布和发展轨迹。</p></details></section>

    <section class="card">
      <label for="jsonInput">点位 JSON（[{lat,lng,title,desc}]）</label>
      <textarea id="jsonInput" rows="8"></textarea>
      <div class="actions">
        <button id="renderBtn" type="button" aria-label="render">渲染地图</button>
        <label class="export-config" for="exportScale">
          导出倍率
          <select id="exportScale">
            <option value="2">2x（高清）</option>
            <option value="3" selected>3x（超清）</option>
            <option value="4">4x（海报）</option>
          </select>
        </label>
        <button id="exportBtn" type="button" aria-label="export">导出高清 PNG</button>
      </div>
      <p id="status" role="status" aria-live="polite">状态: 等待渲染</p>
    </section>

    <section class="card">
      <div id="map" class="map"></div>
    </section>
  </main>
  <script src="../shared/vendor/leaflet.js"></script>
  <script src="../shared/vendor/html2canvas.min.js"></script>
  <script src="./pm-metrics.js" defer></script>
<script src="./app.js" defer></script>

  <!-- Privacy Notice -->
  <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">
    🔒 隐私提示：本工具所有数据处理均在您的浏览器本地完成，不会上传任何数据至服务器。
  </div>

  <!-- Cross-Project Navigation -->
  <nav aria-label="工具箱导航" style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">
    <a href="https://yuuqq.github.io/journalism-toolbox/" style="text-decoration:none;">📋 工具箱导航</a>
    <span style="opacity:.4">P15</span>
  </nav>

  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>

  <script src="../shared/toast.js" defer></script>

  <script src="../shared/pedagogy-data-p1.js" defer></script>
  <script src="../shared/pedagogy-data-p2.js" defer></script>
  <script src="../shared/global-nav.js" defer></script>
  <script src="../shared/kbd-hints.js" defer></script>
</body>
